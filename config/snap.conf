# Uncomment these two lines to add support for encoders to your firmware
# and enable the encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the OLED Display
# CONFIG_ZMK_DISPLAY=y

# RGB underglow: LEDs were removed from the hardware. Do not re-enable, and never
# bind &ext_power: VCC also feeds the column demux, so turning it off kills the matrix
# and the off state is saved to flash (recovery needs the settings_reset image).

# Power
# Deep sleep (CONFIG_ZMK_SLEEP) must stay OFF: the demux kscan driver is polling-only
# and cannot wake the MCU, so the halves would sleep until reset.
# Soft-off instead: manual power-off via &soft_off, wake with each half's reset button.
# Applies to both halves (snap.conf matches snap_left and snap_right).
CONFIG_ZMK_PM_SOFT_OFF=y

# dongle_display!view (https://github.com/mctechnology17/zmk-dongle-display-view)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
