# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: snap_left nice_view_adapter dongle_display_view_pro_micro
    # The dongle_display_view shield .conf targets a USB-powered dongle and is merged
    # after config/snap.conf, so overrides must go here. 0 dBm TX instead of +8 dBm;
    # stop the display tick/animation after the 60 s idle timeout.
    cmake-args: -DCONFIG_BT_CTLR_TX_PWR_0=y -DCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
  - board: nice_nano_v2
    shield: snap_right
  # Recovery image: flashing it wipes saved settings (BT bonds, ext-power state, ...).
  # Flash it, then flash the normal firmware again.
  - board: nice_nano_v2
    shield: settings_reset
